<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OMP Antigravity — social preview</title>
<link rel="stylesheet" href="brand.css">
<style>
  .og { width: 1280px; height: 640px; padding: 54px 64px 48px; display: grid; grid-template-rows: 44px 1fr 34px; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .og .wordmark { font-size: 36px; gap: 16px; }
  .og .wordmark img { width: 44px; height: 44px; }
  .og .label { font-size: 26px; }
  .hero { align-self: center; }
  h1 { margin: 0; font-size: 80px; line-height: 1.04; letter-spacing: -.045em; font-weight: 600; white-space: nowrap; }
  h1 span { color: var(--lift); }
  .tagline { margin-top: 18px; color: var(--body); font-size: 33px; line-height: 1.2; letter-spacing: -.01em; }
  .tagline .mono { font-size: .88em; letter-spacing: 0; color: var(--ink); }
  svg { display: block; margin-top: 36px; }
  svg text { font-family: "JetBrains Mono", monospace; font-size: 26px; font-weight: 500; letter-spacing: .12em; fill: #b6bec7; }
  svg text.lift { fill: #c4e05c; }
  .og .status { font-size: 28px; gap: 16px; white-space: nowrap; }
  .og .status .sep { margin: 0 8px; }
  .og .dot { width: 14px; height: 14px; }
  .og .kin { width: 12px; height: 12px; }
</style>
</head>
<body>
<div class="sheet og">
  <div class="top">
    <div class="wordmark"><img src="logo.svg" alt=""><span>OMP Antigravity</span></div>
    <div class="label">Antigravity-served models for Oh My Pi</div>
  </div>
  <div class="hero">
    <h1>Antigravity serves the model.<br><span>Oh My Pi keeps control.</span></h1>
    <div class="tagline">Gemini, Claude, and GPT-OSS through Google’s official <span class="mono">agy</span> CLI.</div>
    <svg width="1152" height="112" viewBox="0 0 1152 112" role="img" aria-label="A turn runs in Antigravity's lane; each tool call drops to Oh My Pi, runs there, and returns.">
      <text x="0" y="22">ANTIGRAVITY</text>
      <text x="0" y="98">OH MY PI</text>
      <rect x="236" y="80" width="916" height="16" rx="4" fill="#e8ecef"/>
      <path d="M236 13 H590 V76.5 H880 V13 H1122" fill="none" stroke="#c4e05c" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M1120 -2 L1146 13 L1120 28 Z" fill="#c4e05c"/>
      <text x="735" y="46" text-anchor="middle" class="lift">TOOL CALL</text>
    </svg>
  </div>
  <div class="status">
    <span class="dot"></span><span>official agy CLI · your own sign-in</span>
    <span class="sep">·</span>
    <span class="kin"></span><span class="quiet">companion to oh-my-pi</span>
  </div>
</div>
</body>
</html>
